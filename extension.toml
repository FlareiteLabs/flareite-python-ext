# Python: highlighting from a Tree-sitter grammar compiled to WebAssembly, and
# Pyright. No code. See Flareite's docs/extensions.md#languages.
id = "flareite.python"
name = "Python"
version = "0.2.0"
description = "Python highlighting, and Pyright for diagnostics, hover, definitions, and completion."
author = "Flareite"
api_version = "1"

[engines]
flareite = ">=0.1.0"

[permissions]
language_servers = true

[[languages]]
id = "python"
name = "Python"
file_extensions = ["py", "pyi"]
grammar = "grammars/tree-sitter-python.wasm"
highlights = "queries/highlights.scm"
folds = "queries/folds.scm"
line_comment = "#"
# Brackets and quotes typed in pairs, as in VS Code's language configuration.
brackets = [["{", "}"], ["[", "]"], ["(", ")"]]
# With a prefix (f, r, b, u), a quote after a word is still a string's start.
auto_closing_pairs = [
  [
    "{",
    "}",
  ],
  [
    "[",
    "]",
  ],
  [
    "(",
    ")",
  ],
  { open = '"', close = '"', not_in = [
    "string",
  ] },
  { open = 'r"', close = '"', not_in = [
    "string",
    "comment",
  ] },
  { open = 'R"', close = '"', not_in = [
    "string",
    "comment",
  ] },
  { open = 'u"', close = '"', not_in = [
    "string",
    "comment",
  ] },
  { open = 'U"', close = '"', not_in = [
    "string",
    "comment",
  ] },
  { open = 'f"', close = '"', not_in = [
    "string",
    "comment",
  ] },
  { open = 'F"', close = '"', not_in = [
    "string",
    "comment",
  ] },
  { open = 'b"', close = '"', not_in = [
    "string",
    "comment",
  ] },
  { open = 'B"', close = '"', not_in = [
    "string",
    "comment",
  ] },
  { open = "'", close = "'", not_in = [
    "string",
    "comment",
  ] },
  { open = "r'", close = "'", not_in = [
    "string",
    "comment",
  ] },
  { open = "R'", close = "'", not_in = [
    "string",
    "comment",
  ] },
  { open = "u'", close = "'", not_in = [
    "string",
    "comment",
  ] },
  { open = "U'", close = "'", not_in = [
    "string",
    "comment",
  ] },
  { open = "f'", close = "'", not_in = [
    "string",
    "comment",
  ] },
  { open = "F'", close = "'", not_in = [
    "string",
    "comment",
  ] },
  { open = "b'", close = "'", not_in = [
    "string",
    "comment",
  ] },
  { open = "B'", close = "'", not_in = [
    "string",
    "comment",
  ] },
]
surrounding_pairs = [["{", "}"], ["[", "]"], ["(", ")"], ['"', '"'], ["'", "'"]]

# `npm install -g pyright`
[[language_servers]]
name = "pyright"
command = "pyright-langserver"
args = ["--stdio"]
languages = ["python"]
root_markers = ["pyproject.toml", "setup.py", "pyrightconfig.json"]
